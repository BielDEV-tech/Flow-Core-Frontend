
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Flow Core</title>

    <link rel="stylesheet" href="front-end-login.css">

</head>

<body>

    <!-- CARD DE ERRO -->
    <div id="cardErro" class="card-erro" role="alert" aria-live="assertive">

        <button
            type="button"
            class="fechar-erro"
            onclick="fecharErro()"
            aria-label="Fechar mensagem"
        >×</button>

        <div class="icone-erro">!</div>

        <div class="conteudo-erro">

            <h3>Não foi possível entrar</h3>

            <p id="textoErro">CPF ou senha inválidos.</p>

        </div>

    </div>

    <div class="login">

        <div class="card-login">

            <h1>Flow Core</h1>

            <h2>Entrar</h2>

            <input
                type="text"
                id="cpf"
                placeholder="Digite seu CPF"
            >

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >

            <button onclick="login()">
                Entrar
            </button>

            <p id="mensagem"></p>

            <p>
                Ainda não possui uma conta?
            </p>

            <button type="button" onclick="irParaCadastro()">
                Criar conta
            </button>
        </div>

    </div>

    <script src="front-end-login.js"></script>

</body>

</html>

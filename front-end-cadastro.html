
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Flow Core</title>

    <link rel="stylesheet" href="front-endcss.css">
</head>

<body>

    <div class="cadastro-container">

        <div class="card-cadastro">

            <div class="logo">Flow <span>Core</span></div>

            <h1>Criar sua conta</h1>
            <p class="subtitulo">Comece sua jornada com a Flow Core.</p>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome"
                        placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf"
                        placeholder="Digite seu CPF"
                        maxlength="14" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email"
                        placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha"
                        placeholder="Crie uma senha"
                        minlength="8" required>
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha"
                        placeholder="Digite sua senha novamente"
                        required>
                </div>

                <p id="mensagem"></p>

                <button type="submit" id="botaoCadastrar">
                    Criar conta
                </button>

            </form>

            <p class="login-link">
                Já possui uma conta?
                <a href="./front-end-login.html">Entrar</a>
            </p>

        </div>

    </div>

    <script src="front-end-cadastro.js"></script>

</body>
</html>
